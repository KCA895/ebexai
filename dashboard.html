<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Developer Dashboard - EbexAI</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #667eea;
            --primary-dark: #5568d3;
            --secondary: #764ba2;
            --success: #10b981;
            --danger: #ef4444;
            --warning: #f59e0b;
            --text-primary: #1f2937;
            --text-secondary: #6b7280;
            --text-tertiary: #9ca3af;
            --bg-primary: #ffffff;
            --bg-secondary: #f9fafb;
            --bg-tertiary: #f3f4f6;
            --border: #e5e7eb;
            --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
            --shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.1), 0 1px 2px 0 rgba(0, 0, 0, 0.06);
            --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
            --shadow-xl: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 24px;
            color: var(--text-primary);
            position: relative;
            overflow-x: hidden;
        }

        /* Animated Background */
        body::before {
            content: '';
            position: fixed;
            top: -50%;
            right: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255,255,255,0.1) 1px, transparent 1px);
            background-size: 50px 50px;
            animation: backgroundMove 20s linear infinite;
            pointer-events: none;
            z-index: 0;
        }

        @keyframes backgroundMove {
            0% { transform: translate(0, 0); }
            100% { transform: translate(50px, 50px); }
        }

        .dashboard-container {
            max-width: 1400px;
            margin: 0 auto;
            position: relative;
            z-index: 1;
            animation: fadeInUp 0.6s ease-out;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .dashboard-header {
            background: rgba(255, 255, 255, 0.98);
            backdrop-filter: blur(20px);
            padding: 28px 36px;
            border-radius: 20px;
            box-shadow: var(--shadow-xl);
            margin-bottom: 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        .dashboard-header h1 {
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            font-size: 32px;
            font-weight: 800;
            letter-spacing: -0.5px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            margin-bottom: 24px;
        }

        .stat-card {
            background: rgba(255, 255, 255, 0.98);
            backdrop-filter: blur(20px);
            padding: 28px;
            border-radius: 20px;
            box-shadow: var(--shadow-lg);
            border: 1px solid rgba(255, 255, 255, 0.3);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }

        .stat-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, var(--primary) 0%, var(--secondary) 100%);
            transform: scaleX(0);
            transform-origin: left;
            transition: transform 0.4s ease;
        }

        .stat-card:hover {
            transform: translateY(-4px);
            box-shadow: var(--shadow-xl);
        }

        .stat-card:hover::before {
            transform: scaleX(1);
        }

        .stat-card h3 {
            color: var(--text-secondary);
            font-size: 13px;
            margin-bottom: 12px;
            text-transform: uppercase;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        .stat-card .stat-value {
            font-size: 40px;
            font-weight: 800;
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            line-height: 1;
        }

        .data-section {
            background: rgba(255, 255, 255, 0.98);
            backdrop-filter: blur(20px);
            padding: 32px;
            border-radius: 20px;
            box-shadow: var(--shadow-xl);
            margin-bottom: 24px;
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 28px;
            flex-wrap: wrap;
            gap: 16px;
        }

        .section-header h2 {
            color: var(--text-primary);
            font-size: 24px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .filter-tabs {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        .filter-tabs button {
            padding: 10px 20px;
            border: 2px solid var(--border);
            background: var(--bg-secondary);
            color: var(--text-secondary);
            border-radius: 12px;
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }

        .filter-tabs button:hover {
            background: var(--bg-tertiary);
            border-color: var(--primary);
            transform: translateY(-2px);
        }

        .filter-tabs button.active {
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            color: white;
            border-color: transparent;
            box-shadow: var(--shadow-md);
        }

        .user-list {
            display: grid;
            gap: 20px;
        }

        .user-card {
            background: var(--bg-secondary);
            padding: 24px;
            border-radius: 16px;
            border-left: 4px solid var(--primary);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: var(--shadow);
            animation: slideInCard 0.4s ease-out;
        }

        @keyframes slideInCard {
            from {
                opacity: 0;
                transform: translateX(-20px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .user-card:hover {
            box-shadow: var(--shadow-lg);
            transform: translateX(4px);
        }

        .user-card.vpn-detected {
            border-left-color: var(--danger);
            background: linear-gradient(135deg, rgba(239, 68, 68, 0.05) 0%, var(--bg-secondary) 100%);
        }

        .user-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
            align-items: flex-start;
            flex-wrap: wrap;
            gap: 12px;
        }

        .user-id {
            font-weight: 700;
            color: var(--text-primary);
            font-size: 16px;
            font-family: 'Monaco', 'Courier New', monospace;
        }

        .user-badge {
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            transition: transform 0.2s;
        }

        .user-badge:hover {
            transform: scale(1.05);
        }

        .badge-email { background: #dbeafe; color: #1e40af; border: 1px solid #93c5fd; }
        .badge-google { background: #fce7f3; color: #be123c; border: 1px solid #fbcfe8; }
        .badge-anonymous { background: #f3e8ff; color: #6b21a8; border: 1px solid #e9d5ff; }
        .badge-vpn { background: #fee2e2; color: #991b1b; border: 1px solid #fecaca; font-weight: 700; }

        .user-details {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }

        .detail-item {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .detail-label {
            font-size: 11px;
            color: var(--text-tertiary);
            text-transform: uppercase;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        .detail-value {
            font-size: 14px;
            color: var(--text-primary);
            font-weight: 600;
            word-break: break-word;
        }

        .vpn-alert {
            background: linear-gradient(135deg, rgba(245, 158, 11, 0.1) 0%, rgba(239, 68, 68, 0.1) 100%);
            border: 2px solid var(--warning);
            padding: 16px;
            border-radius: 12px;
            margin-bottom: 20px;
            color: #92400e;
            font-size: 14px;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 12px;
            animation: alertPulse 2s ease-in-out infinite;
        }

        @keyframes alertPulse {
            0%, 100% { box-shadow: 0 0 0 0 rgba(245, 158, 11, 0.4); }
            50% { box-shadow: 0 0 0 8px rgba(245, 158, 11, 0); }
        }

        .vpn-alert strong {
            color: var(--danger);
            font-weight: 700;
        }

        .vpn-alert::before {
            content: '⚠️';
            font-size: 24px;
        }

        .chat-messages {
            margin-top: 20px;
            padding-top: 20px;
            border-top: 2px solid var(--border);
        }

        .chat-messages h4 {
            margin-bottom: 16px;
            color: var(--text-primary);
            font-size: 16px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .chat-item {
            background: white;
            padding: 14px 16px;
            margin-bottom: 12px;
            border-radius: 12px;
            border-left: 3px solid var(--primary);
            box-shadow: var(--shadow-sm);
            transition: all 0.2s;
        }

        .chat-item:hover {
            box-shadow: var(--shadow-md);
            transform: translateX(4px);
        }

        .chat-item.deleted {
            opacity: 0.7;
            border-left-color: var(--danger);
            background: linear-gradient(135deg, rgba(239, 68, 68, 0.05) 0%, white 100%);
        }

        .chat-header-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
            font-size: 12px;
        }

        .chat-sender {
            font-weight: 700;
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .chat-time {
            color: var(--text-tertiary);
            font-size: 11px;
        }

        .chat-text {
            color: var(--text-primary);
            font-size: 14px;
            line-height: 1.6;
        }

        .deleted-badge {
            display: inline-block;
            padding: 4px 10px;
            background: var(--danger);
            color: white;
            border-radius: 12px;
            font-size: 10px;
            font-weight: 700;
            margin-left: 10px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .chat-room {
            background: var(--bg-secondary);
            padding: 16px;
            margin-bottom: 16px;
            border-radius: 12px;
            border: 2px solid var(--border);
        }

        .chat-room-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
            padding-bottom: 8px;
            border-bottom: 1px solid var(--border);
        }

        .chat-room-stats {
            font-size: 12px;
            color: var(--text-tertiary);
            margin-bottom: 12px;
        }

        .chat-room-messages {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .message-item {
            background: white;
            padding: 12px;
            border-radius: 8px;
            border-left: 3px solid var(--primary);
        }

        .refresh-btn {
            padding: 12px 24px;
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            color: white;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: var(--shadow-md);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .refresh-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 16px -2px rgba(102, 126, 234, 0.4);
        }

        .refresh-btn:active {
            transform: translateY(0);
        }

        .loading, .no-data {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-secondary);
            font-size: 16px;
            animation: fadeIn 0.5s;
        }

        .loading::before {
            content: '';
            display: inline-block;
            width: 40px;
            height: 40px;
            margin-bottom: 16px;
            border: 4px solid var(--border);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Admin Login Styles */
        .admin-login {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .login-card {
            background: rgba(255, 255, 255, 0.98);
            backdrop-filter: blur(20px);
            padding: 48px 40px;
            border-radius: 24px;
            box-shadow: var(--shadow-xl);
            width: 100%;
            max-width: 440px;
            animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        .login-logo {
            display: flex;
            justify-content: center;
            margin-bottom: 24px;
            animation: logoFloat 3s ease-in-out infinite;
        }

        @keyframes logoFloat {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
        }

        .login-card h1 {
            text-align: center;
            font-size: 28px;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 8px;
            letter-spacing: -0.5px;
        }

        .login-subtitle {
            text-align: center;
            color: var(--text-secondary);
            font-size: 15px;
            margin-bottom: 32px;
        }

        .login-form {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .input-group {
            position: relative;
        }

        .input-icon {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            pointer-events: none;
            z-index: 1;
        }

        .input-group input {
            width: 100%;
            padding: 14px 16px 14px 48px;
            border: 2px solid var(--border);
            border-radius: 12px;
            font-size: 15px;
            font-weight: 400;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            background: var(--bg-primary);
            color: var(--text-primary);
            font-family: inherit;
        }

        .input-group input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.1);
        }

        .login-error {
            padding: 12px 16px;
            background: rgba(239, 68, 68, 0.1);
            border: 2px solid var(--danger);
            border-radius: 12px;
            color: var(--danger);
            font-size: 14px;
            font-weight: 600;
            text-align: center;
        }

        .btn-login {
            width: 100%;
            padding: 14px 24px;
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            box-shadow: var(--shadow-md);
            font-family: inherit;
        }

        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 16px -2px rgba(102, 126, 234, 0.4);
        }

        .btn-login:active {
            transform: translateY(0);
        }

        /* Responsive */
        @media (max-width: 768px) {
            body {
                padding: 16px;
            }

            .login-card {
                padding: 32px 24px;
                max-width: 100%;
            }

            .dashboard-header {
                padding: 20px 24px;
                flex-direction: column;
                align-items: flex-start;
                gap: 16px;
            }

            .dashboard-header h1 {
                font-size: 24px;
            }

            .stats-grid {
                grid-template-columns: 1fr;
            }

            .data-section {
                padding: 20px;
            }

            .section-header {
                flex-direction: column;
                align-items: flex-start;
            }

            .user-details {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <!-- Admin Login Screen -->
    <div id="admin-login" class="admin-login">
        <div class="login-card">
            <div class="login-logo">
                <img src="ebexgramlogo.png" alt="EbexAI Logo" width="80" height="80" style="border-radius: 16px;" />
            </div>
            <h1>Admin Dashboard</h1>
            <p class="login-subtitle">Sign in to access dashboard</p>

            <div class="login-form">
                <div class="input-group">
                    <svg class="input-icon" width="20" height="20" viewBox="0 0 20 20" fill="none">
                        <path d="M2.5 6.66667L9.0755 11.0504C9.63533 11.4236 10.3647 11.4236 10.9245 11.0504L17.5 6.66667M4.16667 15H15.8333C16.7538 15 17.5 14.2538 17.5 13.3333V6.66667C17.5 5.74619 16.7538 5 15.8333 5H4.16667C3.24619 5 2.5 5.74619 2.5 6.66667V13.3333C2.5 14.2538 3.24619 15 4.16667 15Z" stroke="#9CA3AF" stroke-width="1.5" stroke-linecap="round"/>
                    </svg>
                    <input type="email" id="admin-email" placeholder="Admin email" />
                </div>
                <div class="input-group">
                    <svg class="input-icon" width="20" height="20" viewBox="0 0 20 20" fill="none">
                        <path d="M5.83333 9.16667V6.66667C5.83333 4.36548 7.69881 2.5 10 2.5C12.3012 2.5 14.1667 4.36548 14.1667 6.66667V9.16667M10 11.6667V13.3333M6.66667 17.5H13.3333C14.2538 17.5 15 16.7538 15 15.8333V10.8333C15 9.91286 14.2538 9.16667 13.3333 9.16667H6.66667C5.74619 9.16667 5 9.91286 5 10.8333V15.8333C5 16.7538 5.74619 17.5 6.66667 17.5Z" stroke="#9CA3AF" stroke-width="1.5" stroke-linecap="round"/>
                    </svg>
                    <input type="password" id="admin-password" placeholder="Password" />
                </div>
                <div id="login-error" class="login-error" style="display: none;"></div>
                <button onclick="adminLogin()" class="btn-login">
                    <span>Sign In</span>
                    <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
                        <path d="M4.16667 10H15.8333M15.8333 10L10.8333 5M15.8333 10L10.8333 15" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </button>
            </div>
        </div>
    </div>

    <!-- Dashboard Content -->
    <div id="dashboard-content" class="dashboard-container" style="display: none;">
        <div class="dashboard-header">
            <h1>🔐 Developer Dashboard - EbexAI</h1>
            <div style="display: flex; gap: 12px; align-items: center;">
                <span id="admin-email-display" style="color: var(--text-secondary); font-size: 14px;"></span>
                <button class="refresh-btn" onclick="loadDashboardData()">🔄 Refresh</button>
                <button class="refresh-btn" onclick="adminLogout()" style="background: var(--danger);">Logout</button>
            </div>
        </div>

        <div class="stats-grid">
            <div class="stat-card">
                <h3>Total Users</h3>
                <div class="stat-value" id="stat-total-users">0</div>
            </div>
            <div class="stat-card">
                <h3>Active Sessions</h3>
                <div class="stat-value" id="stat-sessions">0</div>
            </div>
            <div class="stat-card">
                <h3>VPN Detected</h3>
                <div class="stat-value" id="stat-vpn">0</div>
            </div>
            <div class="stat-card">
                <h3>Total Messages</h3>
                <div class="stat-value" id="stat-messages">0</div>
            </div>
        </div>

        <div class="data-section">
            <div class="section-header">
                <h2>User Sessions & Data</h2>
                <div class="filter-tabs">
                    <button class="active" onclick="filterUsers('all')">All Users</button>
                    <button onclick="filterUsers('vpn')">VPN Users</button>
                    <button onclick="filterUsers('deleted')">Deleted Chats</button>
                </div>
            </div>
            <div id="users-container" class="loading">Loading data...</div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js';
        import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js';
        import { getFirestore, collection, getDocs, query, orderBy } from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js';

        const firebaseConfig = {
            apiKey: "AIzaSyBAWba58DN7kAWdI0vcHVIVuiOxXX6ZbBY",
            authDomain: "ebex-7fc7b.firebaseapp.com",
            projectId: "ebex-7fc7b",
            storageBucket: "ebex-7fc7b.firebasestorage.app",
            messagingSenderId: "831855823070",
            appId: "1:831855823070:web:0578de78870123226a9a4f",
            measurementId: "G-Q93SLJQ0W5"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // Admin whitelist - ONLY this email can access dashboard
        const ADMIN_EMAIL = 'kelvinchristianangelo@gmail.com';

        let allUsersData = [];
        let currentFilter = 'all';
        let isAuthenticated = false;

        // Check auth state on load
        onAuthStateChanged(auth, (user) => {
            if (user && user.email === ADMIN_EMAIL) {
                // Admin authenticated
                isAuthenticated = true;
                document.getElementById('admin-login').style.display = 'none';
                document.getElementById('dashboard-content').style.display = 'block';
                document.getElementById('admin-email-display').textContent = user.email;
                loadDashboardData();
            } else {
                // Not authenticated or not admin
                isAuthenticated = false;
                document.getElementById('admin-login').style.display = 'flex';
                document.getElementById('dashboard-content').style.display = 'none';
                if (user && user.email !== ADMIN_EMAIL) {
                    // User logged in but not admin - sign them out
                    signOut(auth);
                    showError('Access denied. Only admin can access this dashboard.');
                }
            }
        });

        // Admin login function
        window.adminLogin = async () => {
            const email = document.getElementById('admin-email').value.trim();
            const password = document.getElementById('admin-password').value;

            if (!email || !password) {
                showError('Please enter email and password');
                return;
            }

            // Check if email is admin
            if (email !== ADMIN_EMAIL) {
                showError('Access denied. You are not authorized to access this dashboard.');
                return;
            }

            try {
                await signInWithEmailAndPassword(auth, email, password);
                // Success handled by onAuthStateChanged
            } catch (error) {
                if (error.code === 'auth/invalid-credential' || error.code === 'auth/wrong-password') {
                    showError('Invalid password');
                } else if (error.code === 'auth/user-not-found') {
                    showError('Admin account not found. Please create account first.');
                } else if (error.code === 'auth/too-many-requests') {
                    showError('Too many failed attempts. Please try again later.');
                } else {
                    showError('Login failed: ' + error.message);
                }
            }
        };

        // Admin logout function
        window.adminLogout = async () => {
            try {
                await signOut(auth);
                document.getElementById('admin-email').value = '';
                document.getElementById('admin-password').value = '';
                hideError();
            } catch (error) {
                console.error('Logout error:', error);
            }
        };

        // Show error message
        function showError(message) {
            const errorDiv = document.getElementById('login-error');
            errorDiv.textContent = message;
            errorDiv.style.display = 'block';
        }

        // Hide error message
        function hideError() {
            const errorDiv = document.getElementById('login-error');
            errorDiv.style.display = 'none';
        }

        // Handle Enter key on login form
        document.addEventListener('DOMContentLoaded', () => {
            const passwordInput = document.getElementById('admin-password');
            const emailInput = document.getElementById('admin-email');

            if (passwordInput) {
                passwordInput.addEventListener('keypress', (e) => {
                    if (e.key === 'Enter') adminLogin();
                });
            }
            if (emailInput) {
                emailInput.addEventListener('keypress', (e) => {
                    if (e.key === 'Enter') adminLogin();
                });
            }
        });

        // Load dashboard data
        window.loadDashboardData = async () => {
            if (!isAuthenticated) return;
            document.getElementById('users-container').innerHTML = '<div class="loading">Loading data...</div>';

            try {
                allUsersData = [];
                let totalMessages = 0;
                let vpnCount = 0;
                let uniqueUsers = new Set();

                // Get user sessions data
                const usersSnapshot = await getDocs(collection(db, 'users'));

                for (const userDoc of usersSnapshot.docs) {
                    const userId = userDoc.id;
                    const sessionsRef = collection(db, 'users', userId, 'sessions');
                    const sessionsSnapshot = await getDocs(sessionsRef);

                    for (const sessionDoc of sessionsSnapshot.docs) {
                        const sessionData = sessionDoc.data();
                        uniqueUsers.add(userId);

                        if (sessionData.location?.vpnLikely) {
                            vpnCount++;
                        }

                        // Get all chats for this user (new structure)
                        const userChatsQuery = query(
                            collection(db, 'chats'),
                            where('userId', '==', userId)
                        );
                        const chatsSnapshot = await getDocs(userChatsQuery);

                        const chats = [];
                        for (const chatDoc of chatsSnapshot.docs) {
                            const chatData = chatDoc.data();

                            // Get messages for this chat
                            const messagesQuery = query(
                                collection(db, 'chats', chatDoc.id, 'messages'),
                                orderBy('timestamp', 'asc')
                            );
                            const messagesSnapshot = await getDocs(messagesQuery);

                            const messages = [];
                            messagesSnapshot.forEach(msgDoc => {
                                messages.push({
                                    id: msgDoc.id,
                                    ...msgDoc.data()
                                });
                                totalMessages++;
                            });

                            chats.push({
                                id: chatDoc.id,
                                title: chatData.title,
                                createdAt: chatData.createdAt,
                                messages: messages,
                                messageCount: messages.length
                            });
                        }

                        allUsersData.push({
                            userId,
                            sessionId: sessionDoc.id,
                            ...sessionData,
                            chats
                        });
                    }
                }

                // Update stats
                document.getElementById('stat-total-users').textContent = uniqueUsers.size;
                document.getElementById('stat-sessions').textContent = allUsersData.length;
                document.getElementById('stat-vpn').textContent = vpnCount;
                document.getElementById('stat-messages').textContent = totalMessages;

                // Display users
                displayUsers(currentFilter);
            } catch (error) {
                console.error('Error loading dashboard data:', error);
                document.getElementById('users-container').innerHTML = '<div class="no-data">Error loading data: ' + error.message + '</div>';
            }
        };

        // Filter users
        window.filterUsers = (filter) => {
            currentFilter = filter;

            // Update active button
            document.querySelectorAll('.filter-tabs button').forEach(btn => {
                btn.classList.remove('active');
            });
            event.target.classList.add('active');

            displayUsers(filter);
        };

        // Display users
        function displayUsers(filter) {
            const container = document.getElementById('users-container');

            let filteredData = allUsersData;

            if (filter === 'vpn') {
                filteredData = allUsersData.filter(user => user.location?.vpnLikely);
            } else if (filter === 'deleted') {
                filteredData = allUsersData.filter(user =>
                    user.chats?.some(chat => chat.deleted_by_user)
                );
            }

            if (filteredData.length === 0) {
                container.innerHTML = '<div class="no-data">No data found</div>';
                return;
            }

            container.innerHTML = '<div class="user-list"></div>';
            const userList = container.querySelector('.user-list');

            filteredData.forEach(user => {
                const userCard = createUserCard(user);
                userList.appendChild(userCard);
            });
        }

        // Create user card
        function createUserCard(user) {
            const card = document.createElement('div');
            card.className = 'user-card' + (user.location?.vpnLikely ? ' vpn-detected' : '');

            const authBadgeClass = user.authMethod === 'google' ? 'badge-google' :
                                   user.authMethod === 'email' ? 'badge-email' : 'badge-anonymous';

            let vpnAlert = '';
            if (user.location?.vpnLikely) {
                const vpnProvider = user.location.vpnProvider || 'Unknown';
                const riskScore = user.location.vpnDetection?.riskScore || 0;
                vpnAlert = `
                    <div class="vpn-alert">
                        🚨 <strong>VPN/Proxy Detected</strong><br>
                        Provider: ${vpnProvider} | Risk Score: ${riskScore}%
                    </div>
                `;
            }

            const timestamp = user.timestamp?.toDate ?
                user.timestamp.toDate().toLocaleString() : 'N/A';

            card.innerHTML = `
                <div class="user-header">
                    <div class="user-id">👤 ${user.userId.substring(0, 12)}...</div>
                    <div>
                        <span class="user-badge ${authBadgeClass}">${user.authMethod}</span>
                        ${user.location?.vpnLikely ? '<span class="user-badge badge-vpn">VPN</span>' : ''}
                    </div>
                </div>

                ${vpnAlert}

                <div class="user-details">
                    <div class="detail-item">
                        <div class="detail-label">Email</div>
                        <div class="detail-value">${user.email || 'anonymous'}</div>
                    </div>
                    <div class="detail-item">
                        <div class="detail-label">Session Time</div>
                        <div class="detail-value">${timestamp}</div>
                    </div>
                    <div class="detail-item">
                        <div class="detail-label">IP Address</div>
                        <div class="detail-value">${user.location?.ip || 'N/A'}</div>
                    </div>
                    <div class="detail-item">
                        <div class="detail-label">Location</div>
                        <div class="detail-value">${user.location?.city || 'N/A'}, ${user.location?.country || 'N/A'}</div>
                    </div>
                    <div class="detail-item">
                        <div class="detail-label">ISP</div>
                        <div class="detail-value">${user.location?.isp || 'N/A'}</div>
                    </div>
                    <div class="detail-item">
                        <div class="detail-label">Browser</div>
                        <div class="detail-value">${user.browserInfo?.name || 'N/A'} ${user.browserInfo?.version || ''}</div>
                    </div>
                    <div class="detail-item">
                        <div class="detail-label">OS</div>
                        <div class="detail-value">${user.browserInfo?.os || 'N/A'}</div>
                    </div>
                    <div class="detail-item">
                        <div class="detail-label">Device</div>
                        <div class="detail-value">${user.browserInfo?.isMobile ? 'Mobile' : 'Desktop'}</div>
                    </div>
                    <div class="detail-item">
                        <div class="detail-label">Screen</div>
                        <div class="detail-value">${user.deviceInfo?.screenResolution || 'N/A'}</div>
                    </div>
                    <div class="detail-item">
                        <div class="detail-label">Timezone</div>
                        <div class="detail-value">${user.deviceInfo?.timezone || 'N/A'}</div>
                    </div>
                </div>

                <div class="chat-messages">
                    <h4>💬 Chat Rooms (${user.chats?.length || 0} chats)</h4>
                    ${renderChats(user.chats)}
                </div>
            `;

            return card;
        }

        // Render chats
        function renderChats(chats) {
            if (!chats || chats.length === 0) {
                return '<div class="no-data">No chats yet</div>';
            }

            return chats.map(chat => {
                const createdTime = chat.createdAt?.toDate ?
                    chat.createdAt.toDate().toLocaleString() : 'N/A';

                let messagesHtml = '';
                if (chat.messages && chat.messages.length > 0) {
                    messagesHtml = chat.messages.map(msg => {
                        const msgTime = msg.timestamp?.toDate ?
                            msg.timestamp.toDate().toLocaleTimeString() : 'N/A';

                        return `
                            <div class="message-item">
                                <div class="chat-header-info">
                                    <span class="chat-sender">${msg.sender === 'user' ? '👤 User' : '🤖 Bot'}</span>
                                    <span class="chat-time">${msgTime}</span>
                                </div>
                                <div class="chat-text">${escapeHtml(msg.message || '')}</div>
                            </div>
                        `;
                    }).join('');
                } else {
                    messagesHtml = '<div class="no-data" style="margin: 10px 0;">No messages in this chat</div>';
                }

                return `
                    <div class="chat-room">
                        <div class="chat-room-header">
                            <strong>📝 ${escapeHtml(chat.title || 'Untitled Chat')}</strong>
                            <span class="chat-time">${createdTime}</span>
                        </div>
                        <div class="chat-room-stats">
                            ${chat.messageCount || 0} messages
                        </div>
                        <div class="chat-room-messages">
                            ${messagesHtml}
                        </div>
                    </div>
                `;
            }).join('');
        }

        // Escape HTML
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Load data on page load
        loadDashboardData();
    </script>
</body>
</html>
